<!DOCTYPE html>
<html lang="tr">
<head><meta charset="utf-8"><title>Karakter Görüntüleyici</title>
<style>html,body{margin:0;height:100%;background:#9BCFE0}canvas{width:100%;height:100%;display:block}
#ad{position:fixed;top:10px;left:10px;font:900 20px sans-serif;color:#2B2117;background:rgba(245,235,211,.9);padding:4px 12px;border-radius:8px}</style>
<script type="importmap">
{"imports": {"three": "./vendor/three.module.js",
             "three/addons/loaders/GLTFLoader.js": "./vendor/GLTFLoader.js"}}
</script>
</head>
<body>
<div id="ad"></div>
<canvas id="c"></canvas>
<pre id="log" style="position:fixed;bottom:0;left:0;margin:0;background:rgba(255,255,255,.85);font-size:11px"></pre>
<script>
window.dlog = m => { document.getElementById('log').textContent += m + '\n'; };
window.onerror = (m, s, l) => dlog('HATA: ' + m + ' @' + s + ':' + l);
window.addEventListener('unhandledrejection', e => dlog('REJ: ' + (e.reason?.message ?? e.reason)));
</script>
<script type="module">
import * as THREE from 'three';
import { buildCharacter } from './js/characters/builder.js';

const id = new URLSearchParams(location.search).get('id') ?? 'savasci';
document.getElementById('ad').textContent = id;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9bcfe0);
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(4, 8, 6); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(2.2, 32), new THREE.MeshLambertMaterial({ color: 0x74b35c }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 4.2); camera.lookAt(0, 1, 0);
const karakter = await buildCharacter(id);
scene.add(karakter);
renderer.setAnimationLoop(t => {
  karakter.rotation.y = t / 1600;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
