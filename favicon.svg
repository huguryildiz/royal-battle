<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Royal Battle">
  <title>Royal Battle</title>
  <!-- Palet: css/game.css --ink, --gold, --gold-dark, --danger -->
  <rect width="64" height="64" rx="14" fill="#2B2117"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#57472F" stroke-width="2"/>

  <!-- taç gövdesi -->
  <path d="M13 40 L13 22 L22.5 31.5 L32 18 L41.5 31.5 L51 22 L51 40 Z"
        fill="#E9B33C" stroke="#B9821E" stroke-width="2" stroke-linejoin="round"/>
  <!-- taç bandı -->
  <path d="M12 40 H52 V47 H12 Z" fill="#E9B33C" stroke="#B9821E" stroke-width="2" stroke-linejoin="round"/>
  <!-- bant taşı -->
  <circle cx="32" cy="43.5" r="2.8" fill="#D96C4F" stroke="#B9821E" stroke-width="1.2"/>

  <!-- uç topları -->
  <circle cx="13" cy="20" r="3.6" fill="#E9B33C" stroke="#B9821E" stroke-width="2"/>
  <circle cx="32" cy="16" r="3.6" fill="#E9B33C" stroke="#B9821E" stroke-width="2"/>
  <circle cx="51" cy="20" r="3.6" fill="#E9B33C" stroke="#B9821E" stroke-width="2"/>
</svg>
