<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Royal Battle">
<meta name="theme-color" content="#2B2117">
<title>Royal Battle</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="css/game.css">
<script type="importmap">
{"imports": {"three": "./vendor/three.module.js",
             "three/addons/loaders/GLTFLoader.js": "./vendor/GLTFLoader.js"}}
</script>
</head>
<body>
<div id="intro">
  <video autoplay muted loop playsinline src="assets/hero-video.mp4" aria-hidden="true"></video>
  <div class="intro-inner">
    <div class="intro-crown">👑</div>
    <h1 class="intro-logo">Royal<br>Battle</h1>
    <p class="intro-tag">Aslan Yıldız'ın oyunu</p>
    <div class="intro-panel panel">
      <p class="intro-pill"><span class="dot"></span>Kayıt hazır — 🏰 Seviye <b id="intro-seviye">1</b> · 🪙 <b id="intro-altin">0</b></p>
      <button class="bigbtn intro-oyna" id="oyna-btn" type="button">⚔️ Oyna</button>
      <p class="intro-tip">İpucu: Köyde binalara dokunarak gezebilirsin.</p>
    </div>
  </div>
</div>
<div id="hud">
  <span class="logo">Royal Battle</span>
  <span class="pill" id="hud-gold">🪙 <b id="gold-n">0</b></span>
  <span class="pill" id="hud-gem">💎 <b id="gem-n">0</b></span>
  <button class="pill" id="ses-btn" type="button" aria-label="Sesi aç veya kapat">🔊</button>
</div>
<main>
  <section class="screen" id="s-koy"><div id="village-map"></div></section>
  <section class="screen" id="s-savas"><canvas id="battle-canvas"></canvas><div id="battle-ui"></div></section>
  <section class="screen" id="s-is"><div id="wood-ui"></div></section>
  <section class="screen" id="s-envanter"><div id="inv-ui"></div></section>
  <section class="screen" id="s-dukkan"><div id="shop-ui"></div></section>
  <section class="screen" id="s-maden"><div id="mine-ui"></div></section>
</main>
<nav id="tabs">
  <button data-s="s-koy">Köy</button><button data-s="s-savas">Savaş</button>
  <button data-s="s-is">İş</button><button data-s="s-envanter">Envanter</button>
  <button data-s="s-dukkan">Dükkan</button>
</nav>
<footer id="credits">Grafikler: Kenney.nl — Tasarım: Aslan Yıldız</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
