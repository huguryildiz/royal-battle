<!DOCTYPE html>
<!-- Bir GLB'yi 8 yaw açısında yan yana render eder, doğru cepheyi seçmek için.
     Kullanım: render-kontakt.html?glb=assets/tripo/bina-savas.glb -->
<meta charset="utf-8">
<title>kontakt</title>
<style>
  html, body { margin: 0; padding: 0; background: #222; }
  #out { display: block; }
  #gl { display: none; }
</style>

<script type="importmap">
{"imports": {"three": "./vendor/three.module.js",
             "three/addons/loaders/GLTFLoader.js": "./vendor/GLTFLoader.js"}}
</script>

<script type="module">
render();

async function render() {
  const THREE = await import('three');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');

  const params = new URLSearchParams(location.search);
  const dosya = params.get('glb');
  const pitch = parseFloat(params.get('pitch') ?? '18');
  const acilar = [0, 45, 90, 135, 180, 225, 270, 315];
  const hucre = 256;

  const glCanvas = document.getElementById('gl');
  const out = document.getElementById('out');
  out.width = hucre * 4; out.height = hucre * 2 + 24;
  const octx = out.getContext('2d');
  octx.fillStyle = '#222'; octx.fillRect(0, 0, out.width, out.height);

  const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 1.15));
  const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(5, 10, 7); scene.add(sun);
  const dolgu = new THREE.DirectionalLight(0xcfe4ff, 0.5); dolgu.position.set(-6, 3, -5); scene.add(dolgu);

  let g;
  try { g = await new GLTFLoader().loadAsync(dosya); }
  catch (e) { document.title = 'HATA: ' + (e?.message ?? e); return; }

  const m = g.scene;
  scene.add(m);
  const box = new THREE.Box3().setFromObject(m);
  const merkez = box.getCenter(new THREE.Vector3());
  const boyut = box.getSize(new THREE.Vector3());
  const r = Math.max(boyut.x, boyut.y, boyut.z);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.01, r * 20);
  const uzak = r * 2.4;
  const rad = pitch * Math.PI / 180;
  cam.position.set(merkez.x, merkez.y + Math.sin(rad) * uzak, merkez.z + Math.cos(rad) * uzak);
  cam.lookAt(merkez);

  octx.font = 'bold 20px sans-serif';
  octx.fillStyle = '#ffd24a';
  acilar.forEach((yaw, i) => {
    m.rotation.y = yaw * Math.PI / 180;
    renderer.render(scene, cam);
    const cx = (i % 4) * hucre, cy = Math.floor(i / 4) * (hucre + 12);
    octx.drawImage(glCanvas, cx, cy, hucre, hucre);
    octx.fillStyle = '#ffd24a';
    octx.fillText('yaw ' + yaw, cx + 8, cy + hucre + 8);
  });

  // sprite.sh ile aynı sebeple indirme: headless --screenshot GLB'ye yetişmiyor.
  const indir = params.get('dl');
  if (indir) {
    const a = document.createElement('a');
    a.href = out.toDataURL('image/png');
    a.download = indir + '.png';
    document.body.appendChild(a);
    a.click();
  }
  document.title = 'HAZIR';
}
</script>

<canvas id="gl" width="1024" height="1024"></canvas>
<canvas id="out"></canvas>
